apiVersion: v1
kind: ServiceAccount
metadata:
  name: perf-server
  namespace: perf-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perf-server
  namespace: perf-test
  labels:
    app: perf-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: perf-server
  template:
    metadata:
      labels:
        app: perf-server
    spec:
      serviceAccountName: perf-server
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: perf-server
  namespace: perf-test
spec:
  selector:
    app: perf-server
  ports:
    - name: http
      port: 80
      targetPort: http