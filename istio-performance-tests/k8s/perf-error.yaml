apiVersion: v1
kind: ServiceAccount
metadata:
  name: perf-error
  namespace: perf-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: perf-error-nginx
  namespace: perf-test
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      location / {
        default_type text/plain;
        return 500 "perf-error: deliberate HTTP 500";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perf-error
  namespace: perf-test
  labels:
    app: perf-error
spec:
  replicas: 1
  selector:
    matchLabels:
      app: perf-error
  template:
    metadata:
      labels:
        app: perf-error
    spec:
      serviceAccountName: perf-error
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: perf-error-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: perf-error
  namespace: perf-test
spec:
  selector:
    app: perf-error
  ports:
    - name: http
      port: 80
      targetPort: http