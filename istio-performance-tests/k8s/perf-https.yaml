apiVersion: v1
kind: ServiceAccount
metadata:
  name: perf-https
  namespace: perf-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: perf-https-nginx
  namespace: perf-test
data:
  default.conf: |
    server {
      listen 8443 ssl;
      server_name perf-https.passthrough.segwarez.com perf-https.perf-test.svc.cluster.local;
      ssl_certificate /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      location / {
        default_type text/plain;
        return 200 "perf-https: TLS terminated by nginx\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perf-https
  namespace: perf-test
  labels:
    app: perf-https
spec:
  replicas: 1
  selector:
    matchLabels:
      app: perf-https
  template:
    metadata:
      labels:
        app: perf-https
    spec:
      serviceAccountName: perf-https
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: tls
              containerPort: 8443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: tls
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: perf-https-nginx
        - name: tls
          secret:
            secretName: perf-https-tls
---
apiVersion: v1
kind: Service
metadata:
  name: perf-https
  namespace: perf-test
spec:
  selector:
    app: perf-https
  ports:
    - name: tls
      port: 8443
      targetPort: tls