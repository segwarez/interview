apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: ingress-tls-passthrough-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: tls-passthrough
        protocol: HTTPS
      tls:
        mode: PASSTHROUGH
      hosts:
        - "*.passthrough.segwarez.com"