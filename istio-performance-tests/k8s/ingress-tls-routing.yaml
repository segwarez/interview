apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: perf-server-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: api-segwarez-com-tls
      hosts:
        - api.segwarez.com
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: perf-server-ingress
  namespace: istio-ingress
spec:
  hosts:
    - api.segwarez.com
  gateways:
    - perf-server-gateway
  http:
    - name: route-to-server
      match:
        - uri:
            exact: /server
        - uri:
            prefix: /server/
      rewrite:
        uri: /
      route:
        - destination:
            host: perf-server.perf-test.svc.cluster.local
            port:
              number: 80
    - name: route-to-error
      match:
        - uri:
            exact: /error
        - uri:
            prefix: /error/
      rewrite:
        uri: /
      route:
        - destination:
            host: perf-error.perf-test.svc.cluster.local
            port:
              number: 80