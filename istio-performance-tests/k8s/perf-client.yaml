apiVersion: v1
kind: ServiceAccount
metadata:
  name: perf-client
  namespace: perf-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perf-client
  namespace: perf-test
  labels:
    app: perf-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: perf-client
  template:
    metadata:
      labels:
        app: perf-client
    spec:
      serviceAccountName: perf-client
      containers:
        - name: perf-client
          image: curlimages/curl:8.12.1
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi